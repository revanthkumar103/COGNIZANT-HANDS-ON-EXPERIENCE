<div class="container">
    <h1>{{ portalName }}</h1>
    <p>
        Manage your courses, enrollments and student profile from one place.
    </p>

    <div class="actions">
        <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
        <p *ngIf="message" class="message">{{ message }}</p>
    </div>

    <div class="search-box">
        <label>Search Courses: </label>
        <input [(ngModel)]="searchTerm" placeholder="Enter course keyword...">
        <p>Searching for: {{ searchTerm }}</p>
    </div>

    <div class="stats">
        <div class="card">
            <h2>{{ availableCoursesCount }}</h2>
            <p>Courses Available</p>
        </div>
        <div class="card">
            <h2>3</h2>
            <p>Enrolled</p>
        </div>
        <div class="card">
            <h2>3.8</h2>
            <p>GPA</p>
        </div>
    </div>

    <app-course-summary-widget></app-course-summary-widget>
</div>
